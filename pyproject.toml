[project]
name = "stemstomp"
version = "0.1.0"
description = "Standalone Wi-Fi-enabled digital effects pedal for multi-track audio stem recording and cloud sync"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "hardware: requires physical Pi hardware",
]
